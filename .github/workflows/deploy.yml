name: Deploy Backend to EC2

# main 에 push 되면 자동으로 jar 빌드 → EC2 전송 → 재기동.
# 수동 실행도 가능(Actions 탭 → Run workflow).
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: false   # 배포 중엔 다음 배포가 끼어들지 않게

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Build jar (테스트 제외 — Testcontainers는 CI에서 무거움)
        run: |
          chmod +x ./gradlew
          ./gradlew bootJar -x test --no-daemon

      - name: Copy jar to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: build/libs/globalhub-0.0.1-SNAPSHOT.jar
          target: /home/${{ secrets.EC2_USER }}/
          strip_components: 2   # build/libs/ 경로 제거 → ~/globalhub-0.0.1-SNAPSHOT.jar 로 도착

      - name: Restart backend on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd ~
            mv -f globalhub-0.0.1-SNAPSHOT.jar app.jar

            # 기존 인스턴스 종료 — self-excluding 패턴('active=pro[d]')으로
            # ssh 세션 cmdline(app.jar 포함)을 죽이지 않도록 한다. (ARCHITECTURE §7 함정 ②)
            pkill -f 'active=pro[d]' || true
            sleep 3

            # ~/.env 환경변수 로드 후 기동. ddl-auto=update 로 baseline 드리프트 validate 실패 회피
            # (컬럼 추가만, 삭제 X = 데이터 안전 — ARCHITECTURE §7 함정 ①)
            set -a
            source ~/.env
            set +a
            # -Xmx420m: t3.micro(1GB)에서 힙 제한이 없으면 기동 중 OOM으로 죽는다 (재발 방지)
            setsid java -Xmx420m -jar ~/app.jar \
              --spring.profiles.active=prod \
              --spring.jpa.hibernate.ddl-auto=update \
              > ~/app.log 2>&1 < /dev/null &

            # 8080 리슨까지 대기(Flyway 마이그레이션 시간 포함, 최대 ~40s).
            # pgrep만으로는 '기동 중 OOM 사망'을 못 잡아 → 실제 포트 리슨으로 판정.
            for i in $(seq 1 8); do
              sleep 5
              if sudo ss -tlnp 2>/dev/null | grep -q ':8080'; then break; fi
            done
            if sudo ss -tlnp 2>/dev/null | grep -q ':8080'; then
              echo "✅ backend started (8080 listening)"
            else
              echo "❌ backend failed to start — last log:"
              tail -40 ~/app.log
              exit 1
            fi
