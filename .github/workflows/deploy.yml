name: Deploy Backend to EC2

# main 에 push 되면 자동으로 jar 빌드 → EC2 전송 → 재기동.
# 수동 실행도 가능(Actions 탭 → Run workflow).
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: false   # 배포 중엔 다음 배포가 끼어들지 않게

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Build jar (테스트 제외 — Testcontainers는 CI에서 무거움)
        run: |
          chmod +x ./gradlew
          ./gradlew bootJar -x test --no-daemon

      - name: Copy jar to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: build/libs/globalhub-0.0.1-SNAPSHOT.jar
          target: /home/${{ secrets.EC2_USER }}/
          strip_components: 2   # build/libs/ 경로 제거 → ~/globalhub-0.0.1-SNAPSHOT.jar 로 도착

      - name: Restart backend on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd ~
            mv -f globalhub-0.0.1-SNAPSHOT.jar app.jar

            # java는 systemd(globalhub.service)가 관리 — 새 jar로 재시작만 한다.
            # systemd라서 ① ssh-action 세션이 끝나도 살아있고(예전 setsid/nohup은 CI에서 죽었음)
            # ② 죽으면 Restart=always로 자동 재시작(OOM 자동 복구)
            # ③ 힙 제한(-Xmx420m)은 service 파일의 ExecStart에 박혀 있음 (ARCHITECTURE §7)
            sudo systemctl restart globalhub

            # 8080 리슨까지 대기(Flyway 마이그레이션 시간 포함, 최대 ~40s)
            for i in $(seq 1 8); do
              sleep 5
              if sudo ss -tlnp 2>/dev/null | grep -q ':8080'; then break; fi
            done
            if sudo ss -tlnp 2>/dev/null | grep -q ':8080'; then
              echo "✅ backend started (8080 listening)"
            else
              echo "❌ backend failed to start — journal:"
              sudo journalctl -u globalhub -n 40 --no-pager
              exit 1
            fi
