spring:
  profiles:
    active: local   # 운영 배포 시 환경변수 SPRING_PROFILES_ACTIVE=prod 로 덮어씀

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  # Flyway가 스키마를 관리한다 (ddl-auto 졸업).
  # baseline-on-migrate: 기존 스키마(운영 RDS 등 비어있지 않은 DB)를 V1 기준선으로 기록 후 V2+만 적용.
  # 신선한 DB(로컬/CI)에서는 V1부터 순서대로 실행.
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1

  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:validate}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: false

  servlet:
    multipart:
      max-file-size: 20MB       # 첨부 파일/사진 1개 최대 (대부분의 사진·PDF 커버)
      max-request-size: 30MB    # 다중 첨부 합계

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:dummy@gmail.com}
    password: ${MAIL_PASSWORD:dummy}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

jwt:
  # 로컬 개발용 기본값 제공. 운영 배포 시 JWT_SECRET 환경변수로 덮어씀.
  secret: ${JWT_SECRET:a2h1Z2xvYmFsaHViLXN1cGVyLXNlY3JldC1rZXktZm9yLWxvY2FsLWRldg==}
  expiration: 86400000        # Access Token 24시간 (밀리초)
  refresh-expiration: 604800000  # Refresh Token 7일 (밀리초)

azure:
  translator:
    key: ${AZURE_TRANSLATOR_KEY:dummy}
    endpoint: https://api.cognitive.microsofttranslator.com
    region: ${AZURE_REGION:koreacentral}

aws:
  s3:
    bucket: ${AWS_S3_BUCKET:dummy-bucket}
    region: ${AWS_S3_REGION:ap-northeast-2}
    access-key: ${AWS_ACCESS_KEY:dummy}
    secret-key: ${AWS_SECRET_KEY:dummy}

# 단일 관리자 계정. 부팅 시 이 이메일 회원에 is_admin=true 동기화(AdminAccountInitializer).
app:
  admin:
    email: ${ADMIN_EMAIL:}

# 멘토링 자동 매칭 스케줄러. 운영은 관리자 수동 매칭으로 전환 → 기본 비활성(false).
mentoring:
  scheduler:
    enabled: ${MENTORING_SCHEDULER_ENABLED:false}
